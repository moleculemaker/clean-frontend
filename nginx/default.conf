server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    #access_log  /var/log/nginx/host.access.log  main;

    # The base image ships with gzip commented out, so the multi-MB main
    # bundle went over the wire uncompressed. text/html is always included.
    # woff/woff2 and images are already compressed and are left out; .ttf has
    # no entry in this image's mime.types, so listing font/ttf would not match.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json
                    image/svg+xml application/vnd.ms-fontobject;

    # Content-hashed build output. The legacy webpack browser builder writes
    # every hashed file at the root as [name].<hex hash>.ext: bundles
    # (main.<hash>.js, runtime.<hash>.js, styles.<hash>.css, lazy chunks) and
    # the fonts and images referenced from CSS. The hash is 16 lowercase hex
    # characters (xxhash64) in Angular 15 through 18; 16+ is matched so a
    # longer digest in a later version still qualifies. The name changes
    # whenever the content does, so it is safe to cache forever. Files copied
    # verbatim from src/assets are never hashed and are deliberately excluded.
    # A missing file is a real 404 here rather than falling through to
    # index.html. This comes before any proxy location because nginx takes the
    # first matching regex location.
    location ~ "^/[^/]+\.[0-9a-f]{16,}\.[A-Za-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Written by entrypoint.sh at container start; must never be served stale.
    location = /assets/config/envvars.json {
        add_header Cache-Control "no-store";
    }

    # index.html and unhashed assets: browsers may keep a copy but must
    # revalidate it on every use so a new deploy is picked up immediately.
    location / {
        index  index.html index.htm;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html =404;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
